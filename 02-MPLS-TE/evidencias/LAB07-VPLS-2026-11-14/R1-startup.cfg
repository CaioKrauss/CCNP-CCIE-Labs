version 16.12
service timestamps debug datetime msec
service timestamps log datetime msec
! Call-home is enabled by Smart-Licensing.
service call-home
platform qfp utilization monitor load 80
platform punt-keepalive disable-kernel-core
platform console serial
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
call-home
 ! If contact email address in call-home is configured as sch-smart-licensing@cisco.com
 ! the email address configured in Cisco Smart License Portal will be used as contact email address to send SCH notifications.
 contact-email-addr sch-smart-licensing@cisco.com
 profile "CiscoTAC-1"
  active
  destination transport-method http
  no destination transport-method email
!
!
!
!
!
!
!
!
!
!
login on-success log
!
!
!
!
!
!
!
subscriber templating
! 
! 
! 
! 
!
!
mpls label protocol ldp
multilink bundle-name authenticated
l2vpn vfi context VPLS100 
 vpn id 100
 member 2.2.2.2 encapsulation mpls
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
crypto pki trustpoint TP-self-signed-2074567696
 enrollment selfsigned
 subject-name cn=IOS-Self-Signed-Certificate-2074567696
 revocation-check none
 rsakeypair TP-self-signed-2074567696
!
crypto pki trustpoint SLA-TrustPoint
 enrollment pkcs12
 revocation-check crl
!
!
crypto pki certificate chain TP-self-signed-2074567696
 certificate self-signed 01 nvram:IOS-Self-Sig#1.cer
crypto pki certificate chain SLA-TrustPoint
 certificate ca 01 nvram:CiscoLicensi#1CA.cer
!
license udi pid CSR1000V sn REDACTED-SERIAL
diagnostic bootup level minimal
memory free low-watermark processor 72329
!
!
spanning-tree extend system-id
!
!
redundancy
bridge-domain 100 
 member GigabitEthernet1 service-instance 100
 member GigabitEthernet2 service-instance 100
 member GigabitEthernet3 service-instance 100
 member vfi VPLS100
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
! 
! 
!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet1
 description VPLS-TO-L2_CE4
 no ip address
 negotiation auto
 no mop enabled
 no mop sysid
 service instance 100 ethernet
  encapsulation untagged
 !
!
interface GigabitEthernet2
 description VPLS-TO-L2_CE3
 no ip address
 negotiation auto
 no mop enabled
 no mop sysid
 service instance 100 ethernet
  encapsulation untagged
 !
!
interface GigabitEthernet3
 description VPLS-TO-L2_CE2
 no ip address
 negotiation auto
 no mop enabled
 no mop sysid
 service instance 100 ethernet
  encapsulation untagged
 !
!
interface GigabitEthernet4
 description MPLS-TO-R2
 ip address 10.0.0.1 255.255.255.252
 negotiation auto
 mpls ip
 no mop enabled
 no mop sysid
!
ip forward-protocol nd
ip http server
ip http authentication local
ip http secure-server
!
ip route 2.2.2.2 255.255.255.255 10.0.0.2
!
!
!
!
mpls ldp router-id Loopback0 force
!
!
!
control-plane
!
!
!
!
!
!
line con 0
 stopbits 1
line vty 0 4
 login
!
!
!
!
!
!
end
