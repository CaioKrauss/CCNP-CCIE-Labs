version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname CE2_A
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.168.102.1 255.255.255.255
!
interface FastEthernet0/0
 ip address 172.16.20.2 255.255.255.252
 duplex full
!
router bgp 65102
 bgp router-id 172.16.20.2
 bgp log-neighbor-changes
 neighbor 172.16.20.1 remote-as 65000
 !
 address-family ipv4
  network 192.168.102.1 mask 255.255.255.255
  neighbor 172.16.20.1 activate
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
!
end
