version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
mpls label protocol ldp
mpls traffic-eng tunnels
clns routing
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
interface Loopback0
 description ROUTER-ID-R1
 ip address 1.1.1.1 255.255.255.255
!
interface Tunnel100
 description RSVP-TE-R1-TO-R4-VIA-R3
 ip unnumbered Loopback0
 tunnel mode mpls traffic-eng
 tunnel destination 4.4.4.4
 tunnel mpls traffic-eng autoroute announce
 tunnel mpls traffic-eng priority 7 7
 tunnel mpls traffic-eng bandwidth 1000
 tunnel mpls traffic-eng path-option 1 explicit name VIA_R3
!
interface FastEthernet0/0
 description LINK-TO-R2
 ip address 10.0.12.1 255.255.255.252
 ip router isis CORE
 duplex full
 mpls ip
 mpls traffic-eng tunnels
 isis network point-to-point 
 isis metric 10 level-2
 ip rsvp bandwidth 10000 10000
!
interface FastEthernet1/0
 description LINK-TO-R3
 ip address 10.0.13.1 255.255.255.252
 ip router isis CORE
 duplex full
 mpls ip
 mpls traffic-eng tunnels
 isis network point-to-point 
 isis metric 30 level-2
 ip rsvp bandwidth 10000 10000
!
router isis CORE
 net 49.0001.0000.0001.0001.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
 mpls traffic-eng router-id Loopback0
 mpls traffic-eng level-2
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip explicit-path name VIA_R3 enable
 next-address 10.0.13.2
 next-address 10.0.34.2
!
!
mpls ldp router-id Loopback0 force
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
!
end
