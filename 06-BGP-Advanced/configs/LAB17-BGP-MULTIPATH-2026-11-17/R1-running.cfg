version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
mpls label protocol ldp
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface FastEthernet0/0
 description LINK-TO-XR1
 ip address 10.0.13.1 255.255.255.252
 ip router isis CORE
 duplex full
 mpls ip
 isis network point-to-point 
 isis metric 10 level-2
!
router isis CORE
 net 49.0001.0000.0003.0003.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
router bgp 65101
 bgp log-neighbor-changes
 network 198.51.100.0
 neighbor 10.0.13.2 remote-as 65000
 neighbor 10.0.13.2 send-community
 neighbor 10.0.13.2 route-map LAB16-COMM out
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 198.51.100.0 255.255.255.0 Null0
!
!
ip prefix-list LAB16-PFX seq 5 permit 198.51.100.0/24
!
route-map LAB16-MED permit 10
 match ip address prefix-list LAB16-PFX
 set metric 500
!
route-map LAB16-MED permit 20
!
route-map LAB16-PREPEND permit 10
 match ip address prefix-list LAB16-PFX
 set as-path prepend 65101 65101 65101
!
route-map LAB16-PREPEND permit 20
!
route-map LAB16-COMM permit 10
 match ip address prefix-list LAB16-PFX
 set community 4266459336 additive
!
route-map LAB16-COMM permit 20
!
mpls ldp router-id Loopback0 force
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
!
end
